<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17181c">
  <title>nexite</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-brand">n</div>
      <h1>nexite</h1>
      <p id="authSubtitle">welcome back.</p>

      <div class="auth-tabs">
        <button id="loginTab" class="active" type="button">log in</button>
        <button id="registerTab" type="button">register</button>
      </div>

      <form id="authForm">
        <label>
          username
          <input id="usernameInput" autocomplete="username" maxlength="20" placeholder="username" required>
        </label>
        <label>
          password
          <input id="passwordInput" type="password" autocomplete="current-password" minlength="6" placeholder="password" required>
        </label>
        <div id="authError" class="auth-error" role="alert"></div>
        <button id="authSubmit" class="auth-submit" type="submit">log in</button>
      </form>

      <p class="auth-note">username + password. that's it.</p>
    </div>
  </section>

  <div id="app" class="hidden">
    <aside class="server-rail" aria-label="servers">
      <button class="server home active" title="home">n</button>
      <div class="rail-line"></div>
      <button class="server" data-server="nexite" title="nexite">NX</button>
      <button class="server" data-server="cubey" title="cubey cult">🧊</button>
      <button class="server add" title="add a server">+</button>
    </aside>

    <aside class="sidebar">
      <header class="server-header">
        <strong id="serverName">nexite</strong>
        <button class="icon-button" title="server menu">⌄</button>
      </header>

      <div class="channel-list">
        <div class="channel-group">
          <div class="group-title"><span>⌄ TEXT CHANNELS</span><button>+</button></div>
          <button class="channel active" data-channel="general"><span>#</span> general</button>
          <button class="channel" data-channel="random"><span>#</span> random</button>
          <button class="channel" data-channel="memes"><span>#</span> memes</button>
        </div>

        <div class="channel-group">
          <div class="group-title"><span>⌄ VOICE CHANNELS</span><button>+</button></div>
          <button class="channel"><span>🔊</span> lounge</button>
          <button class="channel"><span>🔊</span> gaming</button>
        </div>
      </div>

      <div class="user-panel">
        <div id="myAvatar" class="avatar me">?</div>
        <div class="user-copy">
          <strong id="myUsername">...</strong>
          <span>online</span>
        </div>
        <button class="icon-button" title="mute">🎙</button>
        <button id="logoutBtn" class="icon-button" title="log out">↪</button>
      </div>
    </aside>

    <main class="chat">
      <header class="chat-header">
        <div class="channel-title"><span>#</span><strong id="channelTitle">general</strong></div>
        <div class="header-actions">
          <button class="icon-button" title="notifications">🔔</button>
          <button class="icon-button" title="members">👥</button>
          <label class="search"><input id="search" placeholder="Search"><span>⌕</span></label>
        </div>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="messageForm" class="composer">
        <button type="button" class="attach" title="add attachment">+</button>
        <input id="messageInput" autocomplete="off" maxlength="2000" placeholder="Message #general">
        <button type="button" class="composer-action" title="emoji">☺</button>
        <button class="send" type="submit">Send</button>
      </form>
    </main>

    <aside class="members">
      <h3 id="onlineCount">ONLINE — 0</h3>
      <div id="memberList"></div>
    </aside>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
