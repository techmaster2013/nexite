<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12091f">
  <title>nexite</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <section id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-brand">n</div>
      <h1>nexite</h1>
      <p id="authSubtitle">welcome back.</p>
      <div class="auth-tabs">
        <button id="loginTab" class="active" type="button">log in</button>
        <button id="registerTab" type="button">register</button>
      </div>
      <form id="authForm">
        <label>username
          <input id="usernameInput" autocomplete="username" maxlength="20" placeholder="username" required>
        </label>
        <label>password
          <input id="passwordInput" type="password" autocomplete="current-password" minlength="6" placeholder="password" required>
        </label>
        <div id="authError" class="auth-error" role="alert"></div>
        <button id="authSubmit" class="auth-submit" type="submit">log in</button>
      </form>
      <p class="auth-note">username + password. nothing else.</p>
    </div>
  </section>

  <div id="app" class="hidden">
    <aside class="orbit">
      <button id="homeBtn" class="orbit-btn brand active" title="home">n</button>
      <button id="friendsBtn" class="orbit-btn" title="friends">♡</button>
      <div class="orbit-rule"></div>
      <div id="serverRail" class="server-rail"></div>
      <button id="createServerBtn" class="orbit-btn add" title="create space">+</button>
      <div class="orbit-spacer"></div>
      <button id="settingsBtn" class="orbit-btn" title="settings">⚙</button>
    </aside>

    <aside class="sidebar">
      <header class="side-head">
        <div>
          <strong id="sideTitle">home</strong>
          <small id="sideSubtitle">your nexite</small>
        </div>
        <button id="sideAction" class="soft-btn" title="add">+</button>
      </header>
      <div id="sidebarContent" class="side-content"></div>
      <div class="me-card">
        <button id="myAvatar" class="avatar avatar-btn">?</button>
        <div class="me-copy">
          <strong id="myDisplay">...</strong>
          <span id="myUsername">@...</span>
        </div>
        <button id="logoutBtn" class="ghost-btn" title="log out">↪</button>
      </div>
    </aside>

    <main class="chat">
      <header class="chat-head">
        <div class="chat-identity">
          <span id="chatGlyph" class="chat-glyph">✦</span>
          <div>
            <strong id="chatTitle">nexite</strong>
            <small id="chatSubtitle">pick a conversation</small>
          </div>
        </div>
        <div class="chat-actions">
          <button id="chatInfoBtn" class="ghost-btn" title="details">ⓘ</button>
          <label class="search"><span>⌕</span><input id="search" placeholder="search messages"></label>
        </div>
      </header>

      <section id="emptyState" class="empty-state">
        <div class="empty-orb">n</div>
        <h1>your people, your spaces.</h1>
        <p>add a friend, start a dm, or make a space.</p>
        <div>
          <button id="emptyFriendBtn" class="primary-btn">add friend</button>
          <button id="emptyServerBtn" class="soft-btn">create space</button>
        </div>
      </section>

      <section id="messages" class="messages hidden" aria-live="polite"></section>
      <div id="typingBar" class="typing-bar"></div>

      <div id="attachmentPreview" class="attachment-preview hidden"></div>
      <form id="messageForm" class="composer hidden">
        <button id="attachBtn" type="button" class="composer-btn" title="image">＋</button>
        <input id="imageInput" type="file" accept="image/*" hidden>
        <textarea id="messageInput" rows="1" maxlength="4000" placeholder="message"></textarea>
        <button id="emojiBtn" type="button" class="composer-btn" title="emoji">☺</button>
        <button class="send" type="submit">➜</button>
      </form>
    </main>

    <aside id="details" class="details">
      <div id="detailsContent"></div>
    </aside>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <section id="modal" class="modal" role="dialog" aria-modal="true"></section>
  </div>
  <div id="emojiPicker" class="emoji-picker hidden"></div>
  <div id="reactionPicker" class="emoji-picker reaction-picker hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
